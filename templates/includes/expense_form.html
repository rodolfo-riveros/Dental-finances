{% load icons %}<form id="expense-form" class="expense-form" novalidate>
  <div class="form-row">
    <div class="form-group flex-1">
      <label for="expense-date" class="form-label">Fecha</label>
      <div class="input-wrap">
        <span class="input-icon">{% icon "calendar" 16 %}</span>
        <input type="date" id="expense-date" name="date" class="form-input" required />
      </div>
    </div>
    <div class="form-group flex-1">
        <label for="expense-amount" class="form-label">Monto (S/)</label>
      <div class="input-wrap">
          <span class="input-icon">{% icon "landmark" 16 %}</span>
        <input type="number" id="expense-amount" name="amount" placeholder="0.00" step="0.01" min="0" class="form-input" required />
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="expense-category" class="form-label">Categoría</label>
    <div class="input-wrap">
      <span class="input-icon">{% icon "tag" 16 %}</span>
      <select id="expense-category" name="category" class="form-input" required>
        <option value="">Seleccionar categoría...</option>
        {% for group, items in expense_categories.items %}
          <optgroup label="{{ group }}">
            {% for cat in items %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}
          </optgroup>
        {% endfor %}
        <option value="__other__">Otros (especificar)</option>
      </select>
    </div>
    <div class="input-wrap hidden" id="customCategoryWrap" style="margin-top:0.35rem">
      <span class="input-icon">{% icon "edit" 16 %}</span>
      <input type="text" id="expense-custom-category" placeholder="Ej: Prótesis, Resinas..." class="form-input" />
    </div>
  </div>

  <div class="form-group">
    <label for="expense-desc" class="form-label">Descripción</label>
    <div class="input-wrap">
      <span class="input-icon">{% icon "file-text" 16 %}</span>
      <input type="text" id="expense-desc" name="description" placeholder="Ej: Compra de materiales" class="form-input" required />
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Comprobante</label>
    <div class="voucher-upload" id="voucher-area">
      <input type="file" id="expense-voucher" name="voucher" accept="image/*,.pdf" capture="environment" class="voucher-input" />
      <div class="voucher-content" id="voucherContent">
        <div class="voucher-icon-wrap">
          {% icon "camera" 24 "voucher-icon" %}
        </div>
        <span class="voucher-text">Subir Comprobante</span>
        <span class="voucher-subtext">Toca para abrir cámara o galería — JPG, PNG, PDF</span>
      </div>
      <img id="voucher-preview" class="voucher-preview" alt="Vista previa" />
      <button type="button" class="voucher-clear hidden" id="voucherClear">
        {% icon "trash-2" 14 %}
        Eliminar comprobante
      </button>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-save" id="expenseSubmitBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      Guardar Gasto
    </button>
    <button type="button" class="btn-cancel hidden" id="expenseCancelBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      Cancelar
    </button>
  </div>
</form>
